name: Bundle Size

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  size:
    name: Check Bundle Size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Report bundle size
        run: |
          # The budget tracks the app bundle a visitor actually downloads to load
          # the app. On-device AI assets — the model (dist/models), the ONNX
          # runtime (dist/ort) and any *.wasm — are intentionally large and loaded
          # lazily only when their tool is opened, so they are excluded; otherwise
          # a local-AI tool would blow the budget by design.
          TOTAL=$(du -sb --exclude=models --exclude=ort --exclude='*.wasm' dist/ | cut -f1)
          echo "App bundle size (excluding local AI model + runtime): $(numfmt --to=iec $TOTAL)"
          if [ "$TOTAL" -gt $((8 * 1024 * 1024)) ]; then
            echo "::error::App bundle exceeds 8 MB limit ($(numfmt --to=iec $TOTAL))"
            exit 1
          fi
          echo "✅ App bundle within 8 MB limit"
